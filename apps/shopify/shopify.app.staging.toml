# Shopify Partner Dashboard config for the Jefe Staging app.
# Replace the placeholder host with Railway's generated staging URL before deploying
# this config with `npm run deploy -- --config shopify.app.staging.toml`.

client_id = ""
name = "Jefe Staging"
application_url = "https://<railway-staging-url>"
embedded = true

[build]
automatically_update_urls_on_dev = false
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory_levels/update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders/updated"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = [ "products/create" ]
  uri = "/webhooks/products/create"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds/create"

[access_scopes]
# Kept in sync with shopify.app.toml — see that file's comment and docs/shopify-full-scope-audit.md.
scopes = "read_products,write_products,read_orders,write_orders,read_all_orders,read_customers,write_customers,read_customer_events,write_pixels,read_customer_merge,write_customer_merge,read_inventory,write_inventory,write_inventory_transfers,read_inventory_transfers,read_inventory_shipments,write_inventory_shipments,read_inventory_shipments_received_items,write_inventory_shipments_received_items,read_locations,write_locations,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders,read_marketplace_fulfillment_orders,read_fulfillments,write_fulfillments,read_shipping,write_shipping,read_draft_orders,write_draft_orders,read_order_edits,write_order_edits,read_returns,write_returns,read_discounts,write_discounts,read_price_rules,write_price_rules,read_payment_terms,write_payment_terms,read_gift_cards,write_gift_cards,read_content,write_content,read_online_store_pages,read_online_store_navigation,write_online_store_navigation,read_translations,write_translations,read_locales,write_locales,read_markets,write_markets,read_marketing_events,write_marketing_events,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_files,write_files,read_reports,write_reports,read_privacy_settings,write_privacy_settings,read_legal_policies,read_store_credit_accounts,read_store_credit_account_transactions,write_store_credit_account_transactions"

[auth]
redirect_urls = [ "https://<railway-staging-url>/auth/callback" ]
