# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c7d72018569103d47cc8dffb3980e89a"
name = "jefe"
application_url = "https://jefe-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true


[events]
api_version = "2026-07"

  [[events.subscription]]
  topic = "app/uninstalled"
  uri = "/webhooks/app/uninstalled"
  actions = ["delete"]


[webhooks]
api_version = "2026-07"

  # Mandatory GDPR/privacy compliance webhooks. Shopify calls these; the handlers
  # (app/routes/webhooks.customers.*.tsx, webhooks.shop.redact.tsx) verify HMAC via
  # handleShopifyWebhookRequest and are covered by the compliance tests. Registered
  # here so a fresh `shopify app deploy` subscribes them (App Store requirement).
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory_levels/update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders/updated"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = [ "products/create" ]
  uri = "/webhooks/products/create"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds/create"

[access_scopes]
scopes = "read_products,write_products,read_orders,write_orders,read_all_orders,read_customers,write_customers,read_inventory,write_inventory,write_inventory_transfers,read_locations"

[auth]
redirect_urls = [
  "https://jefe-production.up.railway.app/auth/callback",
  "https://app.mynamejefe.com/standalone/callback"
]
