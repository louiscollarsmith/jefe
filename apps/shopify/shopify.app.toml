# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c7d72018569103d47cc8dffb3980e89a"
name = "jefe"
application_url = "https://jefe-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true


[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "order-events"
  topic = "Order"
  uri = "/webhooks/orders/create"
  actions = ["create"]


[webhooks]
api_version = "2026-07"

  # Mandatory GDPR/privacy compliance webhooks. Shopify calls these; the handlers
  # (app/routes/webhooks.customers.*.tsx, webhooks.shop.redact.tsx) verify HMAC via
  # handleShopifyWebhookRequest and are covered by the compliance tests. Registered
  # here so a fresh `shopify app deploy` subscribes them (App Store requirement).
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "inventory_levels/update" ]
  uri = "/webhooks/inventory_levels/update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  [[webhooks.subscriptions]]
  topics = [ "orders/updated" ]
  uri = "/webhooks/orders/updated"

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled" ]
  uri = "/webhooks/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = [ "products/create" ]
  uri = "/webhooks/products/create"

  [[webhooks.subscriptions]]
  topics = [ "products/update" ]
  uri = "/webhooks/products/update"

  [[webhooks.subscriptions]]
  topics = [ "products/delete" ]
  uri = "/webhooks/products/delete"

  [[webhooks.subscriptions]]
  topics = [ "refunds/create" ]
  uri = "/webhooks/refunds/create"

[access_scopes]
# Broadened 2026-08-24 per explicit founder authorization (see CLAUDE.md "OAuth scope
# authorization record" and docs/shopify-full-scope-audit.md) — every scope classified
# APPLICABLE_TO_JEFE there that isn't gated by a Shopify-side approval process, a
# not-yet-available API version, or a restriction to an incompatible app type. Scopes
# requiring separate Shopify/Partner Dashboard approval (Protected Customer Data tier,
# read_all_orders-style order-history approval, subscriptions, Shopify Payments dispute
# data) are deliberately NOT declared here — see docs/shopify-full-scope-audit.md's
# "desired but pending Shopify approval" list. Declaring a scope here does not grant it to
# any merchant: existing installs only gain it after re-consenting via the scopes_update
# webhook flow, and the gateway always re-verifies each merchant's actual live granted
# scopes before any execution (app/lib/shopify/api/gateway.server.js).
scopes = "read_products,write_products,read_orders,write_orders,read_all_orders,read_customers,write_customers,read_customer_events,write_pixels,read_customer_merge,write_customer_merge,read_inventory,write_inventory,write_inventory_transfers,read_inventory_transfers,read_inventory_shipments,write_inventory_shipments,read_inventory_shipments_received_items,write_inventory_shipments_received_items,read_locations,write_locations,read_assigned_fulfillment_orders,write_assigned_fulfillment_orders,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_third_party_fulfillment_orders,read_marketplace_fulfillment_orders,read_fulfillments,write_fulfillments,read_shipping,write_shipping,read_draft_orders,write_draft_orders,read_order_edits,write_order_edits,read_returns,write_returns,read_discounts,write_discounts,read_price_rules,write_price_rules,read_payment_terms,write_payment_terms,read_gift_cards,write_gift_cards,read_content,write_content,read_online_store_pages,read_online_store_navigation,write_online_store_navigation,read_translations,write_translations,read_locales,write_locales,read_markets,write_markets,read_marketing_events,write_marketing_events,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_files,write_files,read_reports,write_reports,read_privacy_settings,write_privacy_settings,read_legal_policies,read_store_credit_accounts,read_store_credit_account_transactions,write_store_credit_account_transactions"

[auth]
redirect_urls = [
  "https://jefe-production.up.railway.app/auth/callback",
  "https://app.mynamejefe.com/standalone/callback"
]
