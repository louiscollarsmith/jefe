name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Quality gate (apps/shopify)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/shopify

    env:
      # Matches the local convention (apps/shopify/.env.example) but points at the
      # postgres service container, which is mapped to the runner's port 5432.
      DATABASE_URL: postgresql://jefe:jefe@localhost:5432/jefe_dev?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jefe
          POSTGRES_PASSWORD: jefe
          POSTGRES_DB: jefe_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jefe -d jefe_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/shopify/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Check schema/migration drift (observability #4)
        # The migrated DB (built from migration files above) must match
        # schema.prisma. NON-BLOCKING (reporting only): running the real
        # `migrate diff` shows REAL pre-existing drift (~15 tables — updated_at
        # DB-default vs @updatedAt, Prisma index-name changes, a few nullability
        # shifts) accumulated from schema edits without matching migrations. The
        # earlier hard-gate flip was a mistake (the "audit" was a column check,
        # not this diff) and reddened CI. Keep it visible; re-enable as a gate
        # only AFTER the drift is reconciled (add migrations to match schema.prisma).
        continue-on-error: true
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel ./prisma/schema.prisma --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
