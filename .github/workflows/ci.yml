name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Quality gate (apps/shopify)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/shopify

    env:
      # Matches the local convention (apps/shopify/.env.example) but points at the
      # postgres service container, which is mapped to the runner's port 5432.
      DATABASE_URL: postgresql://jefe:jefe@localhost:5432/jefe_dev?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jefe
          POSTGRES_PASSWORD: jefe
          POSTGRES_DB: jefe_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jefe -d jefe_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/shopify/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
