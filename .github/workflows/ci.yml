name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    name: Quality gate (apps/shopify)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/shopify

    env:
      # Matches the local convention (apps/shopify/.env.example) but points at the
      # postgres service container, which is mapped to the runner's port 5432.
      DATABASE_URL: postgresql://jefe:jefe@localhost:5432/jefe_dev?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jefe
          POSTGRES_PASSWORD: jefe
          POSTGRES_DB: jefe_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jefe -d jefe_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/shopify/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Check schema/migration drift (observability #4)
        # The migrated DB (built from the migration files above) must match
        # schema.prisma. HARD GATE: definition-level drift fails CI. The
        # pre-existing ~15-table drift was reconciled in migration
        # 20260730140000_reconcile_schema_drift (verified: fresh `migrate deploy`
        # of all migrations in order → `migrate diff --exit-code` = 0). A fresh
        # migrate-deploy now matches schema, so any future drift is a real
        # regression worth blocking.
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel ./prisma/schema.prisma --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Self-reporting red gate: on ANY failed step above, ping #jefe-slack with
      # the branch / commit / run link, so a CI failure surfaces on its own
      # instead of someone having to watch the Actions tab. Uses the same webhook
      # as the app's ops alerts — add it as a repo Actions secret (Settings →
      # Secrets and variables → Actions → new secret ALERT_WEBHOOK_URL, same value
      # as the jefe service's ALERT_WEBHOOK_URL). No-ops until the secret exists.
      - name: Alert #jefe-slack on CI failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "ALERT_WEBHOOK_URL secret not set — skipping Slack alert"; exit 0
          fi
          MSG=":rotating_light: CI failed on ${GITHUB_REF_NAME} (${GITHUB_SHA:0:7}) by ${GITHUB_ACTOR} — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(jq -nc --arg t "$MSG" '{text: $t}')" "$WEBHOOK" \
            && echo "posted CI-failure alert to #jefe-slack" || echo "alert POST failed (non-fatal)"
